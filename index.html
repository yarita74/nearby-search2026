<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>現在地から○km圏内検索</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#ddd; --accent:#1a73e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --fg:#eee; --muted:#999; --line:#333; --accent:#8ab4f8; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system,"Hiragino Sans",sans-serif; }
  #app { display:flex; flex-direction:column; height:100vh; }
  #side { display:none; flex-direction:column; flex:0 0 35vh; min-height:0; border-top:1px solid var(--line); }
  #app.open #side { display:flex; }
  @media (min-width: 800px) {
    #app { display:grid; grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    #app.open { grid-template-columns:1fr 360px; }
    #panel { grid-column:1 / -1; }
    #map { grid-column:1; grid-row:2; min-height:0 !important; }
    #side { grid-column:2; grid-row:2; border-top:0; border-left:1px solid var(--line); }
  }
  #panel { padding:12px 16px; border-bottom:1px solid var(--line); }
  .row { display:flex; gap:8px; align-items:center; margin-top:8px; }
  .row > * { flex:1; }
  .row > label { flex:0 0 auto; color:var(--muted); font-size:13px; }
  input, select, button { font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  input[type=range] { padding:0; }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; }
  button:disabled { opacity:.5; }
  #map { flex:1; min-height:300px; }
  #status { margin-top:8px; color:var(--muted); font-size:13px; }
  #locate { background:#188038; }
  #toggle { display:none; flex:0 0 auto; background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .err { color:#d93025; }
  #list { list-style:none; margin:0; padding:0 16px 16px; overflow:auto; flex:1; }
  #list li { border-top:1px solid var(--line); padding:8px 0; cursor:pointer; }
  #list li small { color:var(--muted); }
  .dist { float:right; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <div class="row">
      <label for="radius">半径 <b id="rv">1</b> km</label>
      <input id="radius" type="range" min="0.1" max="20" step="0.1" value="1">
    </div>
    <div class="row">
      <input id="kw" type="search" placeholder="キーワード(店名・施設名など。空欄なら種類のみ)">
    </div>
    <div class="row">
      <select id="type"></select>
      <button id="search">この円内を検索</button>
      <button id="locate">現在地へ</button>
      <button id="toggle">一覧を閉じる</button>
    </div>
    <div id="status">「現在地へ」を押すか、地図をクリックして中心を指定してください</div>
  </div>
  <div id="map"></div>
  <div id="side">
    <ul id="list"></ul>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = m => m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(2)} km`;

// 検索カテゴリ(OSMタグ)
const TYPES = {
  "カフェ": '"amenity"="cafe"',
  "レストラン": '"amenity"="restaurant"',
  "コンビニ": '"shop"="convenience"',
  "スーパー": '"shop"="supermarket"',
  "薬局": '"amenity"="pharmacy"',
  "病院": '"amenity"="hospital"',
  "ガソリンスタンド": '"amenity"="fuel"',
  "駅": '"railway"="station"',
  "駐車場": '"amenity"="parking"',
  "ATM": '"amenity"="atm"',
  "指定なし(キーワードのみ)": "",
};
$("type").innerHTML = Object.keys(TYPES).map(k => `<option>${k}</option>`).join("");

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371008.8, rad = d => d * Math.PI / 180;
  const a = Math.sin(rad(lat2 - lat1) / 2) ** 2 +
            Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(rad(lon2 - lon1) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

const map = L.map("map").setView([35.681, 139.767], 13); // 初期表示: 東京駅
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);

let center = null, centerIsGps = false, centerMarker = null, circle = null, line = null;
const resultLayer = L.layerGroup().addTo(map);
const radiusM = () => parseFloat($("radius").value) * 1000;

// 検索結果の一覧: 検索後に表示、ボタンで開閉
function showList(open) {
  $("app").classList.toggle("open", open);
  $("toggle").style.display = open || $("list").children.length ? "block" : "none";
  $("toggle").textContent = open ? "一覧を閉じる" : "一覧を開く";
  setTimeout(() => map.invalidateSize(), 0);
}
$("toggle").addEventListener("click", () => showList(!$("app").classList.contains("open")));

function setCenter(latlng, fit = true) {
  center = latlng;
  centerMarker?.remove(); circle?.remove(); line?.remove();
  centerMarker = L.marker(latlng).addTo(map).bindTooltip("中心");
  circle = L.circle(latlng, { radius: radiusM(), color: "#1a73e8", fillOpacity: 0.08 }).addTo(map);
  resultLayer.clearLayers(); $("list").innerHTML = "";
  showList(false);
  if (fit) map.fitBounds(circle.getBounds());
}

$("radius").addEventListener("input", () => {
  $("rv").textContent = $("radius").value;
  if (circle) { circle.setRadius(radiusM()); map.fitBounds(circle.getBounds()); }
});

map.on("click", e => { setCenter(e.latlng, false); centerIsGps = false; $("status").textContent = "地図上の地点を中心に設定しました"; });

$("locate").addEventListener("click", () => {
  $("status").className = ""; $("status").textContent = "現在地を取得中...";
  navigator.geolocation.getCurrentPosition(
    pos => {
      setCenter(L.latLng(pos.coords.latitude, pos.coords.longitude)); centerIsGps = true;
      $("status").textContent = `現在地を取得しました(精度 ±${Math.round(pos.coords.accuracy)}m)`;
    },
    err => {
      $("status").className = "err";
      $("status").textContent = err.code === 1
        ? "位置情報が許可されていません。地図をクリックして中心を指定できます"
        : "現在地を取得できませんでした。地図をクリックして中心を指定できます";
    },
    { enableHighAccuracy: true, timeout: 15000 });
});

// 混雑(429/5xx)や接続失敗のときは、別のサーバーに切り替えて再試行する
const ENDPOINTS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.private.coffee/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
];
async function queryOverpass(q) {
  let lastErr;
  for (const [i, url] of ENDPOINTS.entries()) {
    if (i > 0) $("status").textContent = `混雑のため別のサーバーで再試行中...(${i}/${ENDPOINTS.length - 1})`;
    try {
      const res = await fetch(url, { method: "POST", body: "data=" + encodeURIComponent(q),
        headers: { "Content-Type": "application/x-www-form-urlencoded" }, signal: AbortSignal.timeout(30000) });
      if (res.ok) return await res.json();
      lastErr = new Error(`HTTP ${res.status}`);
    } catch (e) { lastErr = e; }
  }
  throw new Error(`${lastErr.message}(全サーバーが混雑中。少し待って再試行してください)`);
}

$("kw").addEventListener("keydown", e => { if (e.key === "Enter") $("search").click(); });
$("search").addEventListener("click", async () => {
  if (!center) { $("status").className = "err"; $("status").textContent = "先に中心を決めてください"; return; }
  const btn = $("search"); btn.disabled = true;
  $("status").className = ""; $("status").textContent = "検索中...";
  const { lat, lng } = center, r = Math.round(radiusM());
  const tag = TYPES[$("type").value];
  const kw = $("kw").value.trim().replace(/駅$/, "").replace(/[.*+?^${}()|[\]\\"]/g, ".");  // 正規表現の記号は任意の1文字に置換
  if (!tag && !kw) { $("status").className = "err"; $("status").textContent = "種類かキーワードを指定してください"; btn.disabled = false; return; }
  const filter = (tag ? `[${tag}]` : "") + (kw ? `["name"~"${kw}",i]` : "");
  const q = `[out:json][timeout:25];nwr${filter}(around:${r},${lat},${lng});out center tags 200;`;
  try {
    const { elements } = await queryOverpass(q);

    const rows = elements.map(e => {
      const la = e.lat ?? e.center?.lat, lo = e.lon ?? e.center?.lon;
      return la == null ? null : { e, la, lo, d: haversine(lat, lng, la, lo) };
    }).filter(Boolean).sort((a, b) => a.d - b.d);

    const from = centerIsGps ? "現在地" : "指定地点";
    resultLayer.clearLayers();
    const items = rows.map(({ e, la, lo, d }) => {
      const name = e.tags?.name || e.tags?.["name:ja"] || "(名称なし)";
      const m = L.circleMarker([la, lo], { radius: 6, color: "#d93025", fillOpacity: .8 })
        .bindPopup(`<b>${esc(name)}</b><br>${from}から ${fmt(d)}(直線)`).addTo(resultLayer);
      return { name, d, m };
    });
    $("status").textContent = `${items.length}件(${from}からの直線距離順)`;
    $("list").innerHTML = items.map((it, i) =>
      `<li data-i="${i}"><span class="dist">${fmt(it.d)}</span>${esc(it.name)}</li>`).join("");
    $("list").onclick = ev => {
      const li = ev.target.closest("li"); if (!li) return;
      const { m } = items[li.dataset.i];
      line?.remove();
      line = L.polyline([center, m.getLatLng()], { color: "#c5221f", dashArray: "8 6", weight: 4, opacity: 0.9 }).addTo(map);
      map.fitBounds(line.getBounds(), { padding: [60, 60], maxZoom: 17 }); m.openPopup();
    };
    showList(items.length > 0);
  } catch (e) {
    $("status").className = "err"; $("status").textContent = `エラー: ${e.message}`;
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>

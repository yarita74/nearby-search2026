<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>現在地から○km圏内検索</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg:#f4f5f7; --surface:#ffffff; --fg:#1b1f24; --muted:#6a7380; --line:#e3e6ea;
    --accent:#2563eb; --accent-soft:#e8efff; --green:#188038; --danger:#d93025;
    --shadow:0 6px 24px rgba(15,23,42,.16);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --surface:#1f2329; --fg:#eceff3; --muted:#9aa3af; --line:#2e343c;
            --accent:#6ea0ff; --accent-soft:#25324d; --green:#2f9e57; --danger:#ff7b72; --shadow:0 6px 24px rgba(0,0,0,.5); }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }

  #app { position:relative; display:flex; flex-direction:column; height:100vh; height:100dvh; }
  #map { flex:1; min-height:0; z-index:0; }

  /* 操作カード(地図の上に浮かせる) */
  #panel { position:absolute; z-index:1200; top:12px; left:12px; right:12px; display:grid; gap:10px;
           padding:14px; background:var(--surface); border-radius:16px; box-shadow:var(--shadow); }
  @media (min-width: 800px) { #panel { right:auto; width:340px; } }
  .title { display:flex; align-items:center; justify-content:space-between; font-weight:700; font-size:16px; }
  .tr { display:flex; align-items:center; gap:10px; }
  #ctrl { display:grid; gap:10px; }
  .folded #ctrl { display:none; }
  #fold { height:auto; padding:0; background:none; color:var(--accent); font-size:12.5px; }
  .chip { font-weight:600; font-size:13px; color:var(--accent); background:var(--accent-soft); padding:2px 12px; border-radius:999px; }
  input[type=range] { width:100%; margin:0; accent-color:var(--accent); }
  input[type=search], select { width:100%; height:42px; padding:0 12px; font:inherit; color:var(--fg); background:var(--bg);
                               border:1px solid var(--line); border-radius:10px; outline:none; }
  input[type=search]:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  select:disabled { opacity:.45; }
  button { font:inherit; font-weight:600; height:42px; padding:0 14px; border:0; border-radius:10px; cursor:pointer; white-space:nowrap; }
  button:disabled { opacity:.5; cursor:default; }
  #nearby { background:var(--accent); color:#fff; }
  .btns2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  #search { background:transparent; color:var(--accent); border:1.5px solid var(--accent); }
  #locate { background:var(--green); color:#fff; }
  .meta { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:20px; font-size:12.5px; color:var(--muted); }
  #toggle { display:none; height:auto; padding:0; background:none; color:var(--accent); font-size:12.5px; }
  #credit { font-size:12px; color:var(--muted); } #credit:empty { display:none; }
  #credit a { color:var(--accent); }
  .err { color:var(--danger); }

  /* 検索結果 */
  #side { display:none; flex:0 0 40vh; min-height:0; overflow:auto; background:var(--surface); border-top:1px solid var(--line); z-index:1; }
  #app.open #side { display:block; }
  @media (min-width: 800px) {
    #app { flex-direction:row; }
    #side { flex:0 0 380px; border-top:0; border-left:1px solid var(--line); }
  }
  #list { list-style:none; margin:0; padding:0; }
  #list li { display:grid; grid-template-columns:1fr auto; column-gap:12px; align-items:center; padding:12px 16px;
             border-bottom:1px solid var(--line); cursor:pointer; }
  #list li:hover { background:var(--accent-soft); }
  .nm { font-weight:600; line-height:1.35; }
  .ad { grid-column:1; font-size:12.5px; color:var(--muted); line-height:1.35; margin-top:2px; }
  .dist { grid-column:2; grid-row:1 / span 2; font-size:13px; font-weight:600; color:var(--accent); background:var(--accent-soft);
          padding:3px 10px; border-radius:999px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .leaflet-popup-content { font:13px/1.5 -apple-system,"Hiragino Sans",sans-serif; }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="panel">
    <div class="title"><span>近所を検索</span>
      <span class="tr"><span class="chip">半径 <b id="rv">1</b> km</span><button id="fold">条件を閉じる ▲</button></span></div>
    <input id="radius" type="range" min="0.1" max="20" step="0.1" value="1" aria-label="半径(km)">
    <div id="ctrl">
      <input id="kw" type="search" placeholder="店名・施設名で探す(空欄なら種類のみ)">
      <select id="type"></select>
      <button id="nearby">近所の検索</button>
      <div class="btns2">
        <button id="search">この円内を検索</button>
        <button id="locate">現在地へ</button>
      </div>
    </div>
    <div class="meta"><span id="status">「現在地へ」を押すか、地図をクリックして中心を指定してください</span><button id="toggle">一覧を閉じる</button></div>
    <div id="credit"></div>
  </div>
  <div id="side"><ul id="list"></ul></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = m => m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(2)} km`;

// 検索カテゴリ(OSMタグ)
const TYPES = {
  "カフェ": '"amenity"="cafe"',
  "レストラン": '"amenity"="restaurant"',
  "コンビニ": '"shop"="convenience"',
  "スーパー": '"shop"="supermarket"',
  "薬局": '"amenity"="pharmacy"',
  "病院": '"amenity"="hospital"',
  "ガソリンスタンド": '"amenity"="fuel"',
  "駅": '"railway"="station"',
  "駐車場": '"amenity"="parking"',
  "ATM": '"amenity"="atm"',
  "指定なし(キーワードのみ)": "",
};
$("type").innerHTML = Object.keys(TYPES).map(k => `<option>${k}</option>`).join("");

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371008.8, rad = d => d * Math.PI / 180;
  const a = Math.sin(rad(lat2 - lat1) / 2) ** 2 +
            Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(rad(lon2 - lon1) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

const map = L.map("map", { zoomControl: false }).setView([35.681, 139.767], 13); // 初期表示: 東京駅
L.control.zoom({ position: "bottomright" }).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);

let center = null, centerIsGps = false, centerMarker = null, circle = null, line = null;
const resultLayer = L.layerGroup().addTo(map);
const radiusM = () => parseFloat($("radius").value) * 1000;

// 操作カードの条件部分を畳める(スマホでは検索後に自動で畳んで、地図を広く見せる)
function fold(f, refit = false) {
  $("panel").classList.toggle("folded", f);
  $("fold").textContent = f ? "条件を開く ▼" : "条件を閉じる ▲";
  setTimeout(() => { map.invalidateSize(); if (refit && circle) map.fitBounds(circle.getBounds()); }, 0);
}
$("fold").addEventListener("click", () => fold(!$("panel").classList.contains("folded")));

// 検索結果の一覧: 検索後に表示、ボタンで開閉
function showList(open) {
  $("app").classList.toggle("open", open);
  $("toggle").style.display = open || $("list").children.length ? "block" : "none";
  $("toggle").textContent = open ? "一覧を閉じる" : "一覧を開く";
  setTimeout(() => map.invalidateSize(), 0);
}
$("toggle").addEventListener("click", () => showList(!$("app").classList.contains("open")));

function setCenter(latlng, fit = true) {
  center = latlng;
  centerMarker?.remove(); circle?.remove(); line?.remove();
  centerMarker = L.marker(latlng).addTo(map).bindTooltip("中心");
  circle = L.circle(latlng, { radius: radiusM(), color: "#1a73e8", fillOpacity: 0.08 }).addTo(map);
  resultLayer.clearLayers(); $("list").innerHTML = "";
  showList(false);
  if (fit) map.fitBounds(circle.getBounds());
}

$("radius").addEventListener("input", () => {
  $("rv").textContent = $("radius").value;
  if (circle) { circle.setRadius(radiusM()); map.fitBounds(circle.getBounds()); }
});

map.on("click", e => { setCenter(e.latlng, false); centerIsGps = false; $("status").textContent = "地図上の地点を中心に設定しました"; });

function locate() {
  $("status").className = ""; $("status").textContent = "現在地を取得中...";
  navigator.geolocation.getCurrentPosition(
    pos => {
      setCenter(L.latLng(pos.coords.latitude, pos.coords.longitude)); centerIsGps = true;
      $("status").textContent = `現在地を取得しました(精度 ±${Math.round(pos.coords.accuracy)}m)`;
    },
    err => {
      $("status").className = "err";
      $("status").textContent = err.code === 1
        ? "位置情報が許可されていません。地図をクリックして中心を指定できます"
        : "現在地を取得できませんでした。地図をクリックして中心を指定できます";
    },
    { enableHighAccuracy: true, timeout: 15000 });
}
$("locate").addEventListener("click", locate);
locate();  // 起動時に現在地を表示

// 混雑(429/5xx)や接続失敗のときは、別のサーバーに切り替えて再試行する
const ENDPOINTS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.private.coffee/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
];
async function queryOverpass(q) {
  let lastErr;
  for (const [i, url] of ENDPOINTS.entries()) {
    if (i > 0) $("status").textContent = `混雑のため別のサーバーで再試行中...(${i}/${ENDPOINTS.length - 1})`;
    try {
      const res = await fetch(url, { method: "POST", body: "data=" + encodeURIComponent(q),
        headers: { "Content-Type": "application/x-www-form-urlencoded" }, signal: AbortSignal.timeout(30000) });
      if (res.ok) return await res.json();
      lastErr = new Error(`HTTP ${res.status}`);
    } catch (e) { lastErr = e; }
  }
  throw new Error(`${lastErr.message}(全サーバーが混雑中。少し待って再試行してください)`);
}

// キーワードあり: OpenPOI API(全国の店名・施設名・住所)。失敗したらOSMで検索
async function searchOpenPoi(kw, lat, lng, r, limit = 200) {
  const url = `https://api.openpoiapi.com/v1/search?center=${lng},${lat}&radius=${r}&limit=${limit}&q=${encodeURIComponent(kw)}`;
  const res = await fetch(url, { signal: AbortSignal.timeout(15000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const { results } = await res.json();
  return results.map(x => ({ name: x.name || "(名称なし)", addr: x.address || [x.prefecture, x.city].filter(Boolean).join(""),
                             la: x.lat, lo: x.lng, cat: x.category }));
}

// 種類だけの検索をOpenPOIで行うための対応表(OpenPOIには種類での絞り込みがないため、
// 種類ごとの検索語で探し、名前または category に合うものだけ残す)
const POI_TYPES = {
  "カフェ":   { q: "カフェ コーヒー 珈琲 喫茶", cats: ["cafe"], re: /カフェ|cafe|coffee|コーヒー|珈琲|喫茶/i },
  "レストラン": { q: "", cats: ["restaurant", "bar_izakaya"], re: /レストラン|食堂|ラーメン|寿司|焼肉|居酒屋|定食/ },
  "コンビニ": { q: "コンビニ ローソン セブン-イレブン セブンイレブン ファミリーマート ミニストップ", cats: ["convenience_store"], re: /コンビニ|ローソン|セブン|ファミリーマート|ミニストップ|ファミマ/ },
  "スーパー": { q: "スーパー マーケット イオン ライフ 西友 マルエツ", cats: ["grocery"], re: /スーパー(?!スポーツ)|マーケット|イオン(?!銀行)|ライフ|西友|マルエツ|成城石井/ },
  "薬局":     { q: "薬局 ドラッグ 調剤 ファーマシー", cats: [], re: /薬局|ドラッグ|調剤|ファーマ|薬店/ },
  "病院":     { q: "病院 クリニック 医院 診療所", cats: [], re: /病院|クリニック|医院|診療所/ },
  "ガソリンスタンド": { q: "ガソリンスタンド 給油所 ENEOS 出光 コスモ", cats: [], re: /ガソリン|給油|ENEOS|エネオス|出光(?!興産)|コスモ石油|昭和シェル/i },
  "駅":       null,  // OpenPOIは駅の収録が少ないため、OSMで探す
  "駐車場":   { q: "駐車場 パーキング", cats: ["parking"], re: /駐車場|パーキング|parking/i },
  "ATM":      { q: "ATM 銀行 ゆうちょ 信用金庫", cats: [], re: /ATM|銀行|ゆうちょ|信用金庫|郵便局/i },
};
async function searchOpenPoiType(type, lat, lng, r) {
  const t = POI_TYPES[type];
  if (!t) throw new Error("OpenPOI非対応の種類");
  const rows = await searchOpenPoi(t.q, lat, lng, r, 200);
  return rows.filter(x => t.cats.includes(x.cat) || t.re.test(x.name));
}

// OSM(Overpass)。tag は種類、kw は名前の絞り込み
async function searchOsm(tag, kw, lat, lng, r) {
  const re = kw.replace(/駅$/, "").replace(/[.*+?^${}()|[\]\\"]/g, ".");  // 正規表現の記号は任意の1文字に置換
  const filter = (tag ? `[${tag}]` : "") + (re ? `["name"~"${re}",i]` : "");
  const { elements } = await queryOverpass(`[out:json][timeout:25];nwr${filter}(around:${r},${lat},${lng});out center tags 200;`);
  return elements.map(e => ({ name: e.tags?.name || e.tags?.["name:ja"] || "(名称なし)", addr: "",
                              la: e.lat ?? e.center?.lat, lo: e.lon ?? e.center?.lon })).filter(x => x.la != null);
}

// 近所の検索: 半径を広げながら、近い順にN件そろうまで探す(OSM用)
async function nearestOsm(tag, kw, lat, lng, n) {
  let rows = [];
  for (const r of [500, 1000, 2000, 5000, 10000, 20000]) {
    rows = await searchOsm(tag, kw, lat, lng, r);
    if (rows.length >= n) break;
  }
  return rows;
}
const NEARBY_N = 20;

// キーワードを入れたら種類は使わない(OpenPOIは種類で絞れないため)
$("kw").addEventListener("input", () => { $("type").disabled = $("kw").value.trim() !== ""; });
$("kw").addEventListener("keydown", e => { if (e.key === "Enter") $("search").click(); });
async function runSearch(nearby) {
  if (!center) { $("status").className = "err"; $("status").textContent = "先に中心を決めてください"; return; }
  const btns = ["search", "nearby"].map($); btns.forEach(b => b.disabled = true);
  $("status").className = ""; $("status").textContent = "検索中..."; $("credit").innerHTML = "";
  const { lat, lng } = center, r = Math.round(radiusM());
  const kw = $("kw").value.trim(), tag = TYPES[$("type").value];
  if (!tag && !kw) { $("status").className = "err"; $("status").textContent = "種類かキーワードを指定してください"; btns.forEach(b => b.disabled = false); return; }
  try {
    let found, used;
    if (kw) {
      try { found = await searchOpenPoi(kw, lat, lng, nearby ? 50000 : r, nearby ? NEARBY_N : 200); used = "OpenPOI"; }
      catch {
        $("status").textContent = "OpenPOIが使えないため、OSMで検索中...";
        found = nearby ? await nearestOsm("", kw, lat, lng, NEARBY_N) : await searchOsm("", kw, lat, lng, r); used = "OSM";
      }
    } else {
      try {
        found = await searchOpenPoiType($("type").value, lat, lng, nearby ? 50000 : r); used = "OpenPOI";
        if (!found.length) throw new Error("none");
      } catch {
        $("status").textContent = "OSMで検索中...";
        found = nearby ? await nearestOsm(tag, "", lat, lng, NEARBY_N) : await searchOsm(tag, "", lat, lng, r); used = "OSM";
      }
    }
    if (used === "OpenPOI") $("credit").innerHTML = '出典: <a href="https://openpoiapi.com/attribution.html" target="_blank" rel="noopener">OpenPOI API</a>'
      + (kw ? "" : "<br>※種類は名前などから判定しているため、漏れがあります");

    let rows = found.map(x => ({ ...x, d: haversine(lat, lng, x.la, x.lo) })).sort((a, b) => a.d - b.d);
    if (nearby) {
      rows = rows.slice(0, NEARBY_N);
      if (rows.length) {  // 円を、N件が収まる大きさに合わせる
        const km = Math.min(20, Math.max(0.1, Math.ceil(rows[rows.length - 1].d / 100) / 10));
        $("radius").value = km; $("rv").textContent = km;
        circle.setRadius(km * 1000); map.fitBounds(circle.getBounds());
      }
    }
    const from = centerIsGps ? "現在地" : "指定地点";
    resultLayer.clearLayers();
    const items = rows.map(({ name, addr, la, lo, d }) => {
      const m = L.circleMarker([la, lo], { radius: 5, color: "#fff", weight: 1.5, fillColor: "#e5484d", fillOpacity: .95 })
        .bindPopup(`<b>${esc(name)}</b><br>${addr ? esc(addr) + "<br>" : ""}${from}から ${fmt(d)}(直線)`).addTo(resultLayer);
      return { name, addr, d, m };
    });
    $("status").textContent = `${nearby ? "近い順に" : ""}${items.length}件(${from}からの直線距離順・${used})`;
    $("list").innerHTML = items.map((it, i) =>
      `<li data-i="${i}"><div class="nm">${esc(it.name)}</div>${it.addr ? `<div class="ad">${esc(it.addr)}</div>` : ""}<span class="dist">${fmt(it.d)}</span></li>`).join("");
    $("list").onclick = ev => {
      const li = ev.target.closest("li"); if (!li) return;
      const { m } = items[li.dataset.i];
      line?.remove();
      line = L.polyline([center, m.getLatLng()], { color: "#c5221f", dashArray: "8 6", weight: 4, opacity: 0.9 }).addTo(map);
      map.fitBounds(line.getBounds(), { padding: [60, 60], maxZoom: 17 }); m.openPopup();
    };
    showList(items.length > 0);
    if (items.length && matchMedia("(max-width: 799px)").matches) fold(true, true);
  } catch (e) {
    $("status").className = "err"; $("status").textContent = `エラー: ${e.message}`;
  } finally { btns.forEach(b => b.disabled = false); }
}
$("search").addEventListener("click", () => runSearch(false));
$("nearby").addEventListener("click", () => runSearch(true));
</script>
</body>
</html>
